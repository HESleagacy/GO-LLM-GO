<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc">
  <title id="title">Causal attention visibility matrix</title>
  <desc id="desc">A lower-triangular matrix: each row is a query position, each column is a key position, green cells are visible and red cells are blocked future positions.</desc>
  <rect width="620" height="500" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#17243a" text-anchor="middle">
    <text x="345" y="35" font-size="21" font-weight="700">Key position j</text><text x="32" y="270" font-size="21" font-weight="700" transform="rotate(-90 32 270)">Query position i</text>
    <g font-size="16" font-weight="700"><text x="175" y="72">0</text><text x="245" y="72">1</text><text x="315" y="72">2</text><text x="385" y="72">3</text><text x="455" y="72">4</text></g>
    <g font-size="16" font-weight="700"><text x="105" y="125">0</text><text x="105" y="195">1</text><text x="105" y="265">2</text><text x="105" y="335">3</text><text x="105" y="405">4</text></g>
    <g stroke="#ffffff" stroke-width="3">
      <rect x="140" y="85" width="70" height="70" fill="#78c6a3"/><rect x="210" y="85" width="70" height="70" fill="#f2a18d"/><rect x="280" y="85" width="70" height="70" fill="#f2a18d"/><rect x="350" y="85" width="70" height="70" fill="#f2a18d"/><rect x="420" y="85" width="70" height="70" fill="#f2a18d"/>
      <rect x="140" y="155" width="70" height="70" fill="#78c6a3"/><rect x="210" y="155" width="70" height="70" fill="#78c6a3"/><rect x="280" y="155" width="70" height="70" fill="#f2a18d"/><rect x="350" y="155" width="70" height="70" fill="#f2a18d"/><rect x="420" y="155" width="70" height="70" fill="#f2a18d"/>
      <rect x="140" y="225" width="70" height="70" fill="#78c6a3"/><rect x="210" y="225" width="70" height="70" fill="#78c6a3"/><rect x="280" y="225" width="70" height="70" fill="#78c6a3"/><rect x="350" y="225" width="70" height="70" fill="#f2a18d"/><rect x="420" y="225" width="70" height="70" fill="#f2a18d"/>
      <rect x="140" y="295" width="70" height="70" fill="#78c6a3"/><rect x="210" y="295" width="70" height="70" fill="#78c6a3"/><rect x="280" y="295" width="70" height="70" fill="#78c6a3"/><rect x="350" y="295" width="70" height="70" fill="#78c6a3"/><rect x="420" y="295" width="70" height="70" fill="#f2a18d"/>
      <rect x="140" y="365" width="70" height="70" fill="#78c6a3"/><rect x="210" y="365" width="70" height="70" fill="#78c6a3"/><rect x="280" y="365" width="70" height="70" fill="#78c6a3"/><rect x="350" y="365" width="70" height="70" fill="#78c6a3"/><rect x="420" y="365" width="70" height="70" fill="#78c6a3"/>
    </g>
    <g font-size="14"><text x="175" y="125">visible</text><text x="245" y="195">visible</text><text x="315" y="265">visible</text><text x="385" y="335">visible</text><text x="455" y="405">visible</text><text x="455" y="125">blocked</text><text x="455" y="195">blocked</text><text x="385" y="265">blocked</text></g>
    <text x="315" y="472" font-size="15">Green: j &lt;= i. Red: future token, score set to -infinity.</text>
  </g>
</svg>
