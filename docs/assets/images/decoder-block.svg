<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Pre-norm decoder block</title>
  <desc id="desc">The chosen pre-norm decoder variant normalizes the input before causal attention and before the feed-forward network, and adds each sublayer output through a residual path.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087f8c"/></marker></defs>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#17243a" text-anchor="middle" stroke="#17243a" stroke-width="1.5">
    <rect x="35" y="170" width="100" height="65" rx="9" fill="#e8eef9"/><text x="85" y="198" stroke="none" font-size="19" font-weight="700">x</text><text x="85" y="220" stroke="none" font-size="13">[n, d]</text>
    <rect x="190" y="80" width="110" height="60" rx="9" fill="#dff3f5"/><text x="245" y="116" stroke="none" font-size="17" font-weight="700">Norm</text>
    <rect x="190" y="280" width="110" height="60" rx="9" fill="#dff3f5"/><text x="245" y="316" stroke="none" font-size="17" font-weight="700">Norm</text>
    <rect x="370" y="80" width="185" height="60" rx="9" fill="#fff0df"/><text x="462" y="116" stroke="none" font-size="17" font-weight="700">Causal attention</text>
    <rect x="370" y="280" width="185" height="60" rx="9" fill="#fff0df"/><text x="462" y="316" stroke="none" font-size="17" font-weight="700">FFN + activation</text>
    <rect x="650" y="170" width="100" height="65" rx="9" fill="#e8eef9"/><text x="700" y="198" stroke="none" font-size="19" font-weight="700">x'</text><text x="700" y="220" stroke="none" font-size="13">[n, d]</text>
    <path d="M135 202 H175 V110 H190" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 110 H370" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 110 H610 V202 H650" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M135 202 H610 V202 H650" fill="none" stroke="#bd5b16" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M700 235 V250 H135 V312 H190" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 310 H370" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 310 H610 V202 H650" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="30" stroke="none" font-size="20" font-weight="700">Chosen variant: pre-norm</text><text x="500" y="55" stroke="none" font-size="14">x1 = x + Attention(Norm(x)); x2 = x1 + FFN(Norm(x1))</text><text x="500" y="390" stroke="none" font-size="14">Dashed orange line: identity residual path. Post-norm places normalization after addition.</text>
  </g>
</svg>
